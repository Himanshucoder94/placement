<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bapunagar - Placement Data</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #fdfdfd;
    }

    h1 {
      text-align: center;
    }

    #searchBox {
      margin: 20px auto;
      display: block;
      padding: 10px;
      width: 50%;
      font-size: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #999;
      padding: 10px;
      text-align: left;
    }

    tr.hide {
      display: none;
    }
  </style>
</head>
<body>

<h1>Bapunagar - Placement Data</h1>
<input type="text" id="searchBox" placeholder="Search by any field...">
<table id="placementTable"></table>

<script>
  async function fetchSheetData(gid, elementId) {
    const url = `https://docs.google.com/spreadsheets/d/e/2PACX-1vSlyPy66Hfn4xkjwJg8cen4aNbeMTyY1C7Qi469Z88coacH7hQAdjJjzoFwxSmDEsWo6jkB4pEWj8J8/pub?gid=1328928505&single=true&output=csv`;

    try {
      const response = await fetch(url);
      const text = await response.text();
      const rows = text.trim().split("\n").map(row => row.split(","));

      let html = "";
      rows.forEach((row, i) => {
        html += "<tr>";
        row.forEach(cell => {
          html += i === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`;
        });
        html += "</tr>";
      });

      document.getElementById(elementId).innerHTML = html;

      // Enable filtering
      enableTableFilter("searchBox", elementId);

    } catch (err) {
      console.error(`Failed to fetch data for ${elementId}`, err);
    }
  }

  function enableTableFilter(inputId, tableId) {
    const input = document.getElementById(inputId);
    const table = document.getElementById(tableId);

    input.addEventListener("input", function () {
      const filter = input.value.toLowerCase();
      const rows = table.querySelectorAll("tr");

      rows.forEach((row, index) => {
        if (index === 0) return; // skip header
        const cells = row.querySelectorAll("td");
        const match = [...cells].some(cell =>
          cell.textContent.toLowerCase().includes(filter)
        );
        row.classList.toggle("hide", !match);
      });
    });
  }

  // Fetch and render data
  fetchSheetData("1328928505", "placementTable");
</script>

</body>
</html>
